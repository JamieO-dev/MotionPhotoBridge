<script>
let sceneCounter=0;
const icon=(name,classes='')=>`<svg class="icon ${classes}" aria-hidden="true"><use href="#${name}"/></svg>`;
function landscape(type='coast'){
 const id='art'+(++sceneCounter);
 if(type==='mountain') return `<svg viewBox="0 0 960 640" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}s" x2="0" y2="1"><stop stop-color="#d7dce9"/><stop offset="1" stop-color="#f6e0ce"/></linearGradient><linearGradient id="${id}w" x2="0" y2="1"><stop stop-color="#92bec1"/><stop offset="1" stop-color="#326d7a"/></linearGradient></defs><rect width="960" height="640" fill="url(#${id}s)"/><circle cx="722" cy="150" r="64" fill="#fff3d5"/><path d="M-80 425 160 155 325 319 493 80 722 368 940 160 1030 440Z" fill="#9caeb5"/><path d="m111 210 49-55 77 76-56-18-22 20-20-25Zm300-24 82-106 91 114-57-24-31 25-31-30Z" fill="#eef3ec"/><path d="M0 419 157 316 339 464 652 267 960 434V640H0Z" fill="#3b6c76"/><path d="M0 466Q260 429 472 476T960 466V640H0Z" fill="url(#${id}w)"/><path d="M80 512h252m120 58h312m-221-57h280m-600 96h306" stroke="#cde2d8" stroke-width="3" opacity=".35"/><path d="M0 525 70 492 161 541 246 640H0Z" fill="#214d55"/></svg>`;
 if(type==='field') return `<svg viewBox="0 0 960 640" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}s" x2="0" y2="1"><stop stop-color="#b4cee0"/><stop offset="1" stop-color="#e7e5d3"/></linearGradient></defs><rect width="960" height="640" fill="url(#${id}s)"/><circle cx="720" cy="151" r="56" fill="#fff2c9"/><path d="M0 351Q217 224 431 346T960 301V640H0Z" fill="#8b9f73"/><path d="M0 439Q283 300 552 432T960 381V640H0Z" fill="#b0b879"/><path d="M0 549Q362 398 960 529V640H0Z" fill="#d5bd80"/><path d="M432 640Q528 500 514 391" stroke="#f2dfb0" stroke-width="48" fill="none"/><path d="M0 603Q201 558 352 570m300-25q186-9 308 23" stroke="#ae9e69" stroke-width="5" fill="none"/><path d="M186 450v-117" stroke="#556653" stroke-width="10"/><ellipse cx="185" cy="310" rx="74" ry="89" fill="#627e60"/><ellipse cx="225" cy="330" rx="48" ry="63" fill="#75916a"/></svg>`;
 return `<svg viewBox="0 0 960 640" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}s" x2="0" y2="1"><stop stop-color="#bedce9"/><stop offset="1" stop-color="#e3eaf0"/></linearGradient><linearGradient id="${id}w" x2="0" y2="1"><stop stop-color="#659fae"/><stop offset=".5" stop-color="#5bafba"/><stop offset="1" stop-color="#a7d3cf"/></linearGradient><linearGradient id="${id}r" x2=".8" y2="1"><stop stop-color="#84948c"/><stop offset="1" stop-color="#3d655b"/></linearGradient></defs><rect width="960" height="640" fill="url(#${id}s)"/><circle cx="723" cy="131" r="50" fill="#fff8df"/><path d="M0 284Q215 269 460 280T960 266V640H0Z" fill="url(#${id}w)"/><path d="M960 270 822 284 757 321 643 344 579 406 421 463 336 542 212 640H960Z" fill="#ecdfc2"/><path d="M960 231 814 255 770 291 674 316 609 375 465 421 389 503 275 640H960Z" fill="url(#${id}r)"/><path d="M960 253 832 271 781 306 686 330 630 383 483 438 411 511 306 640" stroke="#d5d2b8" stroke-width="11" fill="none"/><path d="m317 568 65-45 37-49 82-38m71-51 84-24 39-34m-554 71 123 2m-184 44 166 3m-139 65 205 5m-250 66 179 8" stroke="#ebf7eb" stroke-width="3" opacity=".75" fill="none"/><path d="M0 575Q47 544 102 580T207 640H0Z" fill="#376d66"/><path d="M12 590q59-14 100 17" stroke="#79957c" stroke-width="3" fill="none"/></svg>`;
}
function sidebar(output){
 const apple=output==='Apple Live Photo';
 return `<aside class="sidebar"><div class="brand"><div class="brandmark">${icon('live')}</div><div><div class="brandname">MotionPhotoBridge</div><div class="tagline">Keep every moment moving.</div></div></div><div class="detectbox"><div class="label">${icon('viewfinder','small-icon')}Automatic detection</div><p>Apple · Google · Samsung</p></div><div class="sectionlabel">CONVERT TO</div><div class="picker"><span>${output}</span>${icon('chev','small-icon')}</div><p class="pickerdesc">${apple?'JPEG + MOV pair':'One JPEG with embedded MP4'}</p><div class="sectionlabel">SAVE IN</div><div class="folderbox">${icon('folder')}<div><div class="foldername">Converted Photos</div><div class="folderpath">/Users/demo/Pictures/<br>Converted Photos</div></div>${icon('chev','small-icon chev')}</div><div class="sectionlabel">CONVERSION</div><div class="settingrow"><span>Keep original audio</span><i class="switch"></i></div><div class="motionlabel">Motion length</div><div class="segments"><span class="active">3 seconds</span><span>Full clip</span></div><p class="settingnote">A short clip is centered on the original photo’s capture time when available.</p>${apple?`<div class="importoptions"><div class="settingrow"><span>Also add to Photos</span><i class="switch off"></i></div><p class="settingnote">Ask for Photos access when you convert. An export is always kept.</p></div>`:''}<div class="privacy"><strong>${icon('shield','small-icon')}On your Mac. No uploads.</strong><p>JPEG + H.264 video · Standard dynamic range. HDR and gain maps aren’t preserved.</p></div></aside>`;
}
function row(name,format,art,size,completed=false){
 return `<article class="row"><div class="rowmain"><div class="thumb">${landscape(art)}</div><div class="rowinfo"><div class="filename">${name}</div><div class="sourcebadge">${icon(format==='Apple Live Photo'?'link':'photo','small-icon')}${format}</div><div class="rowdetail">${completed?'Apple Live Photo exported':'Ready to convert'}</div>${completed?'':`<div class="size">${size}</div>`}</div><div class="rowstatus"><div class="status ${completed?'done':''}">${icon(completed?'checkcircle':'circle','small-icon')}${completed?'Exported':'Ready'}</div><div class="rowactions">${completed?icon('preview')+icon('folder'):''}${icon('close')}</div></div></div>${completed?`<div class="rowoutput">${icon('turn','small-icon')}<strong>Apple Live Photo</strong><span>JPEG + MOV pair</span></div><div class="textlink">Add this Live Photo to Photos</div>`:''}</article>`;
}
function windowBody(output,rows,count,completed=false){
 return `<div class="window"><div class="titlebar"><div class="traffic"><i></i><i></i><i></i></div><span class="windowtitle">MotionPhotoBridge</span></div><div class="layout">${sidebar(output)}<section class="main"><header class="queueheader"><div><h2>Your Photos</h2><p class="subtitle">${count} photos${completed?' · '+count+' exported':''}</p></div><span class="button add">${icon('plus','small-icon')}Add${icon('down','small-icon')}</span><span class="button iconbutton">${icon('dots','small-icon')}</span></header><section class="queue">${rows}</section><footer class="footer">${completed?`<p class="finished">Finished. ${count} photos exported.</p>`:''}<div class="footerbottom"><span class="textlink">${icon('folder','small-icon')}Open export folder</span><span class="button ${completed?'disabled':'primary'}">${icon('repeat','small-icon')}${completed?'Convert Photos':`Convert ${count} Photos`}</span></div></footer></section></div></div>`;
}
const scenes={
1:{title:'Choose where your motion goes.',description:'Convert Apple Live Photos into Google or Samsung Motion Photos.',output:'Google Motion Photo',rows:row('IMG_2048.HEIC','Apple Live Photo','coast','8.4 MB')+row('IMG_2057.HEIC','Apple Live Photo','mountain','10.2 MB'),count:2},
2:{title:'Add your photos. We detect the format.',description:'Mix Apple, Google, and Samsung originals in the same queue.',output:'Apple Live Photo',rows:row('IMG_2048.HEIC','Apple Live Photo','coast','8.4 MB')+row('PXL_20261111_142538_MP.jpg','Google Motion Photo','mountain','7.1 MB')+row('20261111_152017.jpg','Samsung Motion Photo','field','9.6 MB'),count:3},
3:{title:'Preview the moment. Keep the motion.',description:'Check the photo and video, then reveal your export in Finder.',output:'Apple Live Photo',rows:row('PXL_20261111_142538_MP.jpg','Google Motion Photo','coast','',true)+row('20261111_152017.jpg','Samsung Motion Photo','field','',true),count:2,completed:true}
};
const key=Number(new URLSearchParams(location.search).get('scene')||1);
const info=scenes[key]||scenes[1];
document.getElementById('scene').innerHTML=`<header class="heading"><div class="eyebrow">MOTIONPHOTOBRIDGE / FOR MAC</div><h1>${info.title}</h1><p>${info.description}</p></header><div class="frame">${windowBody(info.output,info.rows,info.count,info.completed)}</div><footer class="annotation"><span><b>Interface illustration</b> · Based on MotionPhotoBridge 2 source</span><span class="count">0${key} / 03</span></footer>`;
const win=document.querySelector('.window');
if(key===1){
 win.insertAdjacentHTML('beforeend',`<div class="popover"><div class="popoveritem"><span class="checkspace"></span>Apple Live Photo</div><div class="popoveritem selected"><span class="checkspace">${icon('check','small-icon')}</span>Google Motion Photo</div><div class="popoveritem"><span class="checkspace"></span>Samsung Motion Photo</div></div><svg class="poparrow" viewBox="0 0 20 28" xmlns="http://www.w3.org/2000/svg"><path d="M2 1 2 23l5-5 5 9 4-2-5-9 8-1Z" fill="#33303b" stroke="white" stroke-width="1.5"/></svg>`);
}
if(key===3){
 win.insertAdjacentHTML('beforeend',`<div class="modalshade"></div><section class="preview"><header class="previewhead"><div><strong>Apple Live Photo</strong><p>PXL_20261111_142538_MP.jpg</p></div><span class="button">Done</span></header><div class="segments previewtabs"><span>Photo</span><span class="active">Motion</span></div><div class="previewmedia">${landscape('coast')}<div class="videocontrols">${icon('play')}<span>0:01</span><span class="timeline"></span><span>0:03</span>${icon('volume')}${icon('expand')}</div></div><footer class="previewfooter">${icon('link','small-icon')}JPEG + MOV pair<span class="button">Show in Finder</span></footer></section>`);
}
document.documentElement.dataset.ready='true';
</script>
